rule-providers:

  custom-private:
    behavior: classical
    type: file
    format: text
    path: ./lst/custom-private.txt
    
  custom-ip:
    behavior: ipcidr
    format: text
    type: http
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/custom-ip.txt'
    interval: 86400
    path: ./ruleset/custom-ip.txt
  
  custom:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/custom.txt'
    path: ./ruleset/custom.txt
    interval: 86400
  
  ip-tool:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/ip-tool.txt'
    path: ./ruleset/ip-tool.txt
    interval: 86400
    
  kinopub:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/kinopub.txt'
    path: ./ruleset/kinopub.txt
    interval: 86400
    
  mega-ip:
    behavior: ipcidr
    format: text
    type: http
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/mega-ip.txt'
    interval: 86400
    path: ./ruleset/mega-ip.txt
  
  mega:
    behavior: domain
    type: http
    format: yaml
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/mega.yaml'
    interval: 86400
    path: ./ruleset/mega.yaml
  
  roblox-ip:
    behavior: ipcidr
    format: text
    type: http
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/roblox-ip.txt'
    interval: 86400
    path: ./ruleset/roblox-ip.txt
    
  roblox:
    behavior: domain
    type: http
    format: yaml
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/roblox.yaml'
    interval: 86400
    path: ./ruleset/roblox.yaml

  telegram-ip:
    behavior: ipcidr
    format: text
    type: http
    url: 'https://core.telegram.org/resources/cidr.txt'
    interval: 86400
    path: ./ruleset/telegram-ip.txt
    proxy: PROXY

  telegram:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/telegram.txt'
    path: ./ruleset/telegram.txt
    interval: 86400

  youtube:
    behavior: classical
    type: http
    format: yaml
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/youtube.yaml'
    interval: 86400
    path: ./ruleset/youtube.yaml
    
  claude:
    behavior: classical
    type: http
    format: yaml
    url: 'https://raw.githubusercontent.com/grinderz/rule-providers/refs/heads/master/claude.yaml'
    interval: 86400
    path: ./ruleset/claude.yaml

  openai:
    behavior: classical
    type: http
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/OpenAI/OpenAI.yaml"
